name: validate_pipeline
trigger: 
 branches:
   include:
     - ram
pool: siyaram
stages:
  - stage: init
    displayName: init_s
    jobs:
      - job: init
        displayName: init_j
        steps:
        - task: TerraformTask@5
          displayName: init_t
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'siyaram'
            backendAzureRmResourceGroupName: 'krrg'
            backendAzureRmStorageAccountName: 'krst'
            backendAzureRmContainerName: 'krcon'
            backendAzureRmKey: 'siyaram.tfstate'
  - stage: init_validate
    jobs:
      - job: init_validate
        displayName: init & validate
        steps:
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'siyaram'
            backendAzureRmResourceGroupName: 'krrg'
            backendAzureRmStorageAccountName: 'krst'
            backendAzureRmContainerName: 'krcon'
            backendAzureRmKey: 'siyaram.tfstate'
        - task: TerraformTask@5
          displayName: validate
          inputs:
            provider: 'azurerm'
            command: 'validate'